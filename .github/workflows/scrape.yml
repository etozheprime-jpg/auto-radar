name: scrape
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: scrape
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scraper/requirements.txt && playwright install --with-deps chromium
      - run: xvfb-run -a python scraper/scrape.py --headed
      - name: Commit data
        run: |
          git config user.name "autoradar-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/listings.json
          git diff --staged --quiet || (git commit -m "data: update listings" && git push)
